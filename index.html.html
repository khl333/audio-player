<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        
        .player-container {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .audio-element {
            width: 100%;
            margin: 20px 0;
        }
        
        .status {
            font-style: italic;
            color: #666;
            font-size: 0.9em;
            margin-top: 15px;
        }
        
        .player-title {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .play-button {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            transition: background-color 0.3s;
        }
        
        .play-button:hover {
            background-color: #2980b9;
        }
        
        .download-button {
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            margin: 15px 0;
            text-decoration: none;
            display: inline-block;
        }
        
        .download-button:hover {
            background-color: #27ae60;
        }
        
        .device-detect {
            font-size: 0.8em;
            color: #777;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>Audio Player</h1>
    
    <div class="player-container">
        <div class="player-title" dir="rtl">عارف انك بتدخل عن طريق المتصفح الصيغة نفسها</div>
        
        <!-- Standard HTML5 Audio Player - AAC format has excellent iOS compatibility -->
        <audio id="audioPlayer" class="audio-element" controls playsinline autoplay>
            <source src="https://pub-73b7d6240d41401ebe4d74bcb75d6a99.r2.dev/AAC_%D8%B9%D8%A7%D8%B1%D9%81%20%D8%A7%D9%86%D9%83%20%D8%A8%D8%AA%D8%AF%D8%AE%D9%84%20%D8%B9%D9%86%20%D8%B7%D8%B1%D9%8A%D9%82%20%D8%A7%D9%84%D9%85%D8%AA%D8%B5%D9%81%D8%AD%20%D8%A7%D9%84%D8%B5%D9%8A%D8%BA%D8%A9%20%D9%86%D9%81%D8%B3%D9%87%D8%A7.aac" type="audio/aac">
            <source src="https://pub-73b7d6240d41401ebe4d74bcb75d6a99.r2.dev/AAC_%D8%B9%D8%A7%D8%B1%D9%81%20%D8%A7%D9%86%D9%83%20%D8%A8%D8%AA%D8%AF%D8%AE%D9%84%20%D8%B9%D9%86%20%D8%B7%D8%B1%D9%8A%D9%82%20%D8%A7%D9%84%D9%85%D8%AA%D8%B5%D9%81%D8%AD%20%D8%A7%D9%84%D8%B5%D9%8A%D8%BA%D8%A9%20%D9%86%D9%81%D8%B3%D9%87%D8%A7.aac" type="audio/mp4">
            Your browser doesn't support playing this audio format.
        </audio>
        
        <!-- Large Play Button (for mobile devices that might need a larger touch target) -->
        <div>
            <button id="playButton" class="play-button">▶</button>
        </div>
        
        <div id="playerStatus" class="status">Loading audio player...</div>
        
        <!-- Download Option -->
        <div style="margin-top: 20px;">
            <p>Or download the file directly:</p>
            <a href="https://pub-73b7d6240d41401ebe4d74bcb75d6a99.r2.dev/AAC_%D8%B9%D8%A7%D8%B1%D9%81%20%D8%A7%D9%86%D9%83%20%D8%A8%D8%AA%D8%AF%D8%AE%D9%84%20%D8%B9%D9%86%20%D8%B7%D8%B1%D9%8A%D9%82%20%D8%A7%D9%84%D9%85%D8%AA%D8%B5%D9%81%D8%AD%20%D8%A7%D9%84%D8%B5%D9%8A%D8%BA%D8%A9%20%D9%86%D9%81%D8%B3%D9%87%D8%A7.aac" class="download-button" download>Download Audio</a>
        </div>
    </div>
    
    <div id="deviceInfo" class="device-detect"></div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audioPlayer = document.getElementById('audioPlayer');
            const playButton = document.getElementById('playButton');
            const playerStatus = document.getElementById('playerStatus');
            const deviceInfo = document.getElementById('deviceInfo');
            
            // Detect iOS (including iPadOS)
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            
            // Display device info (helpful for debugging)
            deviceInfo.textContent = isIOS ? 'iOS device detected' : 'Non-iOS device detected';
            
            // AAC is well-supported on iOS, but still requires user interaction to start
            if (isIOS) {
                playerStatus.textContent = 'Tap play to start audio';
            } else {
                playerStatus.textContent = 'Audio ready to play';
            }
            
            // Handle play button click
            playButton.addEventListener('click', () => {
                if (audioPlayer.paused) {
                    // Try to play the audio
                    audioPlayer.play().then(() => {
                        playerStatus.textContent = 'Playing...';
                        playButton.textContent = '⏸';
                    }).catch(error => {
                        console.error('Playback error:', error);
                        playerStatus.textContent = 'Error playing audio. Try using the download option.';
                    });
                } else {
                    audioPlayer.pause();
                    playButton.textContent = '▶';
                    playerStatus.textContent = 'Paused';
                }
            });
            
            // Audio player events
            audioPlayer.addEventListener('playing', () => {
                playerStatus.textContent = 'Now playing...';
                playButton.textContent = '⏸';
            });
            
            audioPlayer.addEventListener('pause', () => {
                playerStatus.textContent = 'Paused';
                playButton.textContent = '▶';
            });
            
            audioPlayer.addEventListener('ended', () => {
                playerStatus.textContent = 'Playback completed';
                playButton.textContent = '▶';
            });
            
            audioPlayer.addEventListener('error', (e) => {
                console.error('Audio error:', e);
                playerStatus.textContent = 'Error loading audio file. Please try downloading it instead.';
            });
            
            audioPlayer.addEventListener('loadeddata', () => {
                playerStatus.textContent = 'Audio loaded and ready to play';
                
                // Attempt autoplay - this will likely be blocked on mobile but works on desktop
                audioPlayer.play().catch(error => {
                    console.log('Autoplay prevented:', error);
                    playerStatus.textContent = 'Tap play to start audio';
                });
            });
        });
    </script>
</body>
</html>
